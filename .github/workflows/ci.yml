name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Compile
        run: >-
          uv run python -m compileall
          app dashboard evaluation knowledge_base
          recommendation_engine reporting root_cause benchmarks tests -q

      - name: Test
        run: uv run pytest -q
